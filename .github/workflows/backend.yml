name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'vercel.json'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: make check-backend PYTHON=python
